<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة الراتب</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#0f766e;--bd:#e3e6ea;--dg:#c62828;--ok:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101315;--card:#1a1e22;--tx:#eceff1;--mu:#9aa4ad;--ac:#2dd4bf;--bd:#2b3137;--dg:#ef7a7a;--ok:#6fcf7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101315;--card:#1a1e22;--tx:#eceff1;--mu:#9aa4ad;--ac:#2dd4bf;--bd:#2b3137;--dg:#ef7a7a;--ok:#6fcf7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:14px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:6px 0 12px}
h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.sum b{display:block;font-size:20px;color:var(--ac)}
.sum span{font-size:12px;color:var(--mu)}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:10px;background:var(--card);color:var(--tx);width:100%}
.row{display:flex;gap:8px;margin-bottom:8px}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--dg);width:auto;padding:4px 8px;font-weight:400}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.hd{display:flex;justify-content:space-between;align-items:center}
.mu{color:var(--mu);font-size:13px}
.w{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);padding:6px 0;font-size:14px}
.done{color:var(--ok)}
</style>
</head>
<body>
<h1>متابعة الراتب</h1>

<div class="card sum">
  <div><b id="tRem">0</b><span>إجمالي الباقي</span></div>
  <div><b id="tCnt">0</b><span>رواتب باقية</span></div>
  <div><b id="tTaken">0</b><span>إجمالي المأخوذ</span></div>
  <div><b id="cur">0</b><span>باقي الراتب الحالي</span></div>
</div>

<div class="card">
  <h2>تسجيل مبلغ مأخوذ</h2>
  <select id="wSal" class="row"></select>
  <div class="row"><input id="wAmt" type="number" inputmode="decimal" placeholder="المبلغ"><input id="wDate" type="date"></div>
  <div class="row"><input id="wNote" placeholder="ملاحظة (اختياري)"></div>
  <button id="addW">تسجيل</button>
</div>

<div class="card">
  <h2>إضافة راتب</h2>
  <div class="row"><input id="sName" placeholder="الشهر (مثال: أكتوبر)"><input id="sAmt" type="number" inputmode="decimal" placeholder="مبلغ الراتب"></div>
  <button id="addS">إضافة</button>
</div>

<div id="list"></div>

<div class="card">
  <h2>نسخة احتياطية</h2>
  <div class="row"><button class="g" id="bk">نسخ البيانات</button><button class="g" id="rs">استرجاع</button></div>
  <div class="mu">البيانات محفوظة على جوالك فقط. انسخ نسخة احتياطية قبل مسح بيانات المتصفح.</div>
</div>

<script>
const KEY="salary_tracker_v1";
let st={salaries:[],withdrawals:[]};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&p.salaries&&p.withdrawals)st=p}}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString("ar-SA",{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const taken=id=>st.withdrawals.filter(w=>w.sid===id).reduce((a,w)=>a+w.amount,0);

function render(){
  let tRem=0,tTaken=0,cnt=0,cur=null;
  st.salaries.forEach(s=>{const t=taken(s.id),r=s.amount-t;tTaken+=t;tRem+=Math.max(r,0);if(r>0){cnt++;if(!cur)cur=r}});
  $("tRem").textContent=fmt(tRem);$("tCnt").textContent=cnt;$("tTaken").textContent=fmt(tTaken);$("cur").textContent=fmt(cur||0);
  const sel=$("wSal"),prev=sel.value;
  sel.innerHTML=st.salaries.length?st.salaries.map(s=>`<option value="${s.id}">${esc(s.name)} — باقي ${fmt(s.amount-taken(s.id))}</option>`).join(""):'<option value="">أضف راتبًا أولًا</option>';
  const first=st.salaries.find(s=>s.amount-taken(s.id)>0);
  sel.value=st.salaries.some(s=>s.id===prev)?prev:(first?first.id:(st.salaries[0]||{}).id||"");
  $("list").innerHTML=st.salaries.map(s=>{
    const t=taken(s.id),r=s.amount-t,p=Math.min(100,s.amount?t/s.amount*100:0);
    const ws=st.withdrawals.filter(w=>w.sid===s.id).sort((a,b)=>b.date.localeCompare(a.date));
    return `<div class="card"><div class="hd"><h2>${esc(s.name)}</h2><button class="s" data-ds="${s.id}">حذف</button></div>
    <div class="bar"><i style="width:${p}%"></i></div>
    <div class="hd"><span class="mu">المأخوذ ${fmt(t)} من ${fmt(s.amount)}</span><b class="${r<=0?"done":""}">${r<=0?"مكتمل":"باقي "+fmt(r)}</b></div>
    ${ws.map(w=>`<div class="w"><span>${fmt(w.amount)} <span class="mu">· ${w.date}${w.note?" · "+esc(w.note):""}</span></span><button class="s" data-dw="${w.id}">✕</button></div>`).join("")}</div>`}).join("");
}

$("addS").onclick=()=>{const n=$("sName").value.trim(),a=parseFloat($("sAmt").value);if(!n||!(a>0))return alert("اكتب الشهر ومبلغ الراتب");st.salaries.push({id:uid(),name:n,amount:a});$("sName").value="";$("sAmt").value="";save();render()};
$("addW").onclick=()=>{const sid=$("wSal").value,a=parseFloat($("wAmt").value);if(!sid)return alert("أضف راتبًا أولًا");if(!(a>0))return alert("اكتب المبلغ");
  const s=st.salaries.find(x=>x.id===sid),r=s.amount-taken(sid);
  if(a>r&&!confirm("المبلغ أكبر من الباقي من هذا الراتب. تسجله؟"))return;
  st.withdrawals.push({id:uid(),sid,amount:a,date:$("wDate").value||today(),note:$("wNote").value.trim()});$("wAmt").value="";$("wNote").value="";save();render()};
$("list").onclick=e=>{const ds=e.target.dataset.ds,dw=e.target.dataset.dw;
  if(ds&&confirm("حذف هذا الراتب وكل مبالغه؟")){st.salaries=st.salaries.filter(s=>s.id!==ds);st.withdrawals=st.withdrawals.filter(w=>w.sid!==ds);save();render()}
  if(dw&&confirm("حذف هذا المبلغ؟")){st.withdrawals=st.withdrawals.filter(w=>w.id!==dw);save();render()}};
$("bk").onclick=async()=>{const t=JSON.stringify(st);try{await navigator.clipboard.writeText(t);alert("تم النسخ. الصقه في ملاحظات أو رسالة لنفسك.")}catch(e){prompt("انسخ هذا النص:",t)}};
$("rs").onclick=()=>{const t=prompt("الصق النسخة الاحتياطية هنا:");if(!t)return;try{const p=JSON.parse(t);if(!p.salaries||!p.withdrawals)throw 0;st=p;save();render()}catch(e){alert("النص غير صحيح")}};
$("wDate").value=today();
render();
</script>
</body>
</html>
